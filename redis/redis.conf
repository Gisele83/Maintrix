# Redis Configuration - Maintrix
# Configuration optimisée pour cache et sessions

bind 0.0.0.0
port 6379
# protected-mode yes + requirepass (injecte au lancement par docker-compose, jamais stocke ici)
protected-mode yes

daemonize no
supervised no

loglevel notice
logfile ""

databases 16

save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

maxmemory 256mb
maxmemory-policy allkeys-lru

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

slowlog-log-slower-than 10000
slowlog-max-len 128

timeout 300
tcp-keepalive 300
