# ═══════════════════════════════════════════════════════════════════
# Environnement de TEST pour testeurs externes — F08
# ═══════════════════════════════════════════════════════════════════
#
#   bash scripts/generate-docker-env.sh .env.test-cloud
#   node scripts/provision-test-env.mjs
#
# Volontairement SÉPARÉ de docker-compose.yml : l'environnement destiné aux
# testeurs ne doit partager ni sa base, ni ses secrets, ni son cycle de vie avec
# le développement.
#
# ═══════════════════════════════════════════════════════════════════
# CE QUI EST INCLUS, ET CE QUI NE L'EST PAS
# ═══════════════════════════════════════════════════════════════════
# Trois services seulement : app, db, nginx. Les autres services de
# docker-compose.yml sont délibérément absents — ils ne sont pas supprimés du
# dépôt, ils n'ont simplement pas leur place ici :
#
#   • redis      — n'est référencé par AUCUN code serveur (constat F03).
#                  L'embarquer ajouterait une surface d'attaque sans usage.
#   • prometheus — scrute `app:5000/api/metrics`, endpoint qui N'EXISTE PAS,
#                  ainsi que nginx, postgres et redis sans exportateurs.
#                  Aucun de ses cinq jobs ne remonterait quoi que ce soit :
#                  livrer cette pile donnerait une fausse impression de
#                  supervision.
#   • grafana    — sans données Prometheus, des tableaux de bord vides.
#   • backup     — `deploy.replicas: 0`, jamais démarré.
#
# L'observabilité de cet environnement repose sur ce qui fonctionne réellement :
# GET /api/health (sonde publique), GET /api/system/health (diagnostic admin,
# incluant l'état des tâches de fond depuis F02), les healthchecks Docker et les
# journaux applicatifs. Voir docs/CLOUD_TEST_ENVIRONMENT.md.
#
# ═══════════════════════════════════════════════════════════════════
# EXPOSITION RÉSEAU
# ═══════════════════════════════════════════════════════════════════
# nginx est le SEUL point d'entrée public (80/443). PostgreSQL n'est pas publié
# du tout ; l'application n'est joignable que depuis la boucle locale de l'hôte,
# pour le diagnostic. Conforme à la règle de déploiement : aucun service interne
# directement exposé à Internet.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: maintrix-test-app
    ports:
      # Boucle locale uniquement — diagnostic depuis l'hôte, jamais Internet.
      - "127.0.0.1:${APP_HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maintrix_test}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}@db:5432/${POSTGRES_DB:-maintrix_test}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET requis}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET requis}
      - KMS_MASTER_KEY=${KMS_MASTER_KEY:?KMS_MASTER_KEY requis}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY requis}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Origines autorisées : le domaine par lequel les testeurs accèdent.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
      # Compte super-admin — indispensable au provisionnement des testeurs (F08).
      # Sans lui, /api/super-admin/login renvoie 503 et aucun compte testeur
      # ne peut être créé.
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL requis}
      - SUPER_ADMIN_PASSWORD_HASH=${SUPER_ADMIN_PASSWORD_HASH:?SUPER_ADMIN_PASSWORD_HASH requis}
      - SUPER_ADMIN_SECRET=${SUPER_ADMIN_SECRET:?SUPER_ADMIN_SECRET requis}
      # Documentation interactive de l'API (/api-docs) — F11.
      # Elle était servie sans condition et sans authentification : la carte
      # complète des routes offerte à tout visiteur du point d'entrée public.
      # Elle reste utile aux testeurs, donc conservée mais désactivée par
      # défaut en production. Passez à "true" pour l'ouvrir sciemment.
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      # Services externes — optionnels. Sans SENDGRID_API_KEY, les identifiants
      # des testeurs sont renvoyés dans la réponse API (comportement F08).
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - test_uploads:/app/uploads
      - test_logs:/app/logs
    networks:
      - maintrix-test
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: maintrix-test-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-maintrix_test}
      - POSTGRES_USER=${POSTGRES_USER:-maintrix_test}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      # Volume NOMMÉ, pas un bind mount : docker-compose.yml utilise
      # `device: ./data/postgres`, qui échoue si le répertoire n'existe pas au
      # préalable — un bloqueur de déploiement de plus.
      - test_postgres:/var/lib/postgresql/data
    # Aucun port publié : la base n'est joignable que depuis le réseau interne.
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - maintrix-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: maintrix-test-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Le bloc 443 exige /etc/ssl/maintrix.crt et .key. Le répertoire ssl/ du
      # dépôt est VIDE : sans certificat, nginx refuse de démarrer.
      # scripts/provision-test-env.mjs en génère un auto-signé si besoin.
      - ./ssl:/etc/ssl:ro
      # Racine du défi Let's Encrypt (HTTP-01). certbot y dépose son jeton, nginx
      # le sert en clair sur le port 80 — voir nginx/conf.d/maintrix.conf.
      # Sans ce partage, le renouvellement automatique du certificat échoue.
      - ./certbot-webroot:/var/www/certbot:ro
      - test_uploads:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - maintrix-test
    healthcheck:
      # 127.0.0.1 et NON localhost : dans l'image nginx:alpine, `localhost`
      # résout d'abord en ::1, alors que nginx n'écoute qu'en IPv4 (le script
      # d'entrée qui ajoute l'écoute IPv6 ne patche que default.conf, absent
      # ici). Avec `localhost`, la sonde reçoit « Connection refused » et le
      # conteneur reste indéfiniment unhealthy.
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Sans start_period, l'état reste « starting » pendant le premier
      # intervalle et toute vérification immédiate le prend pour un échec.
      start_period: 15s

volumes:
  test_postgres:
  test_uploads:
  test_logs:

networks:
  maintrix-test:
    driver: bridge
