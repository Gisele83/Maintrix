version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: maintrix-db
    restart: always
    environment:
      POSTGRES_DB: maintrix
      POSTGRES_USER: maintrix_user
      POSTGRES_PASSWORD: Maintrix2024!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintrix_user -d maintrix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maintrix-network

  # Application Maintrix
  maintrix-app:
    build:
      context: .
      dockerfile: Dockerfile.vm
    container_name: maintrix-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://maintrix_user:Maintrix2024!@postgres:5432/maintrix
      SESSION_SECRET: ${SESSION_SECRET:-changeme-in-production}
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - maintrix-network

  # pgAdmin (Interface web pour PostgreSQL - optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maintrix-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@maintrix.local
      PGADMIN_DEFAULT_PASSWORD: Maintrix2024!
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - maintrix-network

  # Redis Cache (pour améliorer les performances - optionnel)
  redis:
    image: redis:7-alpine
    container_name: maintrix-redis
    restart: always
    command: redis-server --requirepass Maintrix2024!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maintrix-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  maintrix-network:
    driver: bridge
