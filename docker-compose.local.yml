# 🚀 MAINTRIX - Installation Locale Simplifiée Windows
# Configuration Docker Compose optimisée pour Windows 10

version: '3.8'

services:
  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  database:
    image: postgres:15-alpine
    container_name: maintrix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintrix_local
      POSTGRES_USER: maintrix_admin
      POSTGRES_PASSWORD: maintrix_secure_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - maintrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintrix_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # =================================
  # APPLICATION MAINTRIX
  # =================================
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: maintrix-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Configuration Base
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      
      # Base de données locale
      DATABASE_URL: postgresql://maintrix_admin:maintrix_secure_2024@database:5432/maintrix_local
      PGHOST: database
      PGPORT: 5432
      PGUSER: maintrix_admin
      PGPASSWORD: maintrix_secure_2024
      PGDATABASE: maintrix_local
      
      # Sécurité
      SESSION_SECRET: maintrix_session_key_change_in_production_2024
      
      # Email (optionnel - clé factice pour installation locale)
      SENDGRID_API_KEY: "SG.local_deployment_fake_key_emails_disabled"
      
      # Installation locale
      LOCAL_DEPLOYMENT: "true"
      DISABLE_TELEMETRY: "true"
      DISABLE_ANALYTICS: "true"
      
    ports:
      - "8080:5000"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - maintrix-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# =================================
# VOLUMES
# =================================
volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local

# =================================
# RÉSEAU
# =================================
networks:
  maintrix-network:
    driver: bridge
