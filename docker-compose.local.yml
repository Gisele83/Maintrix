# 🚀 MAINTRIX - Installation Locale Simplifiée
# Configuration Docker Compose pour déploiement client local

version: '3.8'

services:
  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  maintrix-db:
    image: postgres:15-alpine
    container_name: maintrix-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintrix_local
      POSTGRES_USER: maintrix_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maintrix_secure_2024}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - maintrix-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintrix_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      postgres 
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB

  # =================================
  # APPLICATION MAINTRIX
  # =================================
  maintrix-app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: maintrix-application
    restart: unless-stopped
    depends_on:
      maintrix-db:
        condition: service_healthy
    environment:
      # Configuration Base
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      
      # Base de données locale
      DATABASE_URL: postgresql://maintrix_admin:${DB_PASSWORD:-maintrix_secure_2024}@maintrix-db:5432/maintrix_local
      PGHOST: maintrix-db
      PGPORT: 5432
      PGUSER: maintrix_admin
      PGPASSWORD: ${DB_PASSWORD:-maintrix_secure_2024}
      PGDATABASE: maintrix_local
      
      # Sécurité
      SESSION_SECRET: ${SESSION_SECRET:-maintrix_session_key_change_in_production_2024}
      
      # Installation locale
      LOCAL_DEPLOYMENT: "true"
      DISABLE_TELEMETRY: "true"
      DISABLE_ANALYTICS: "true"
      
      # APIs optionnelles (configurer selon besoins)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      
      # Domaines autorisés
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://0.0.0.0:${WEB_PORT:-8080}
      
    ports:
      - "${WEB_PORT:-8080}:5000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
      - ./backups:/app/backups
      - ./config:/app/config
    networks:
      - maintrix-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # NGINX REVERSE PROXY (Optionnel)
  # =================================
  maintrix-proxy:
    image: nginx:alpine
    container_name: maintrix-nginx
    restart: unless-stopped
    depends_on:
      - maintrix-app
    environment:
      - UPSTREAM_HOST=maintrix-app
      - UPSTREAM_PORT=5000
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/uploads:/var/www/uploads:ro
      - ./data/logs/nginx:/var/log/nginx
    networks:
      - maintrix-local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - proxy  # Activer avec: docker-compose --profile proxy up

  # =================================
  # SAUVEGARDE AUTOMATIQUE
  # =================================
  maintrix-backup:
    image: postgres:15-alpine
    container_name: maintrix-backup-service
    restart: "no"
    depends_on:
      - maintrix-db
    environment:
      PGHOST: maintrix-db
      PGDATABASE: maintrix_local
      PGUSER: maintrix_admin
      PGPASSWORD: ${DB_PASSWORD:-maintrix_secure_2024}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}  # 2h du matin par défaut
    volumes:
      - ./backups:/backups
      - ./scripts/local-backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - maintrix-local
    command: /bin/sh -c "echo '${BACKUP_SCHEDULE:-0 2 * * *} /usr/local/bin/backup.sh' | crontab - && crond -f"
    profiles:
      - backup  # Activer avec: docker-compose --profile backup up

# =================================
# VOLUMES LOCAUX
# =================================
volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
  backup_data:
    driver: local

# =================================
# RÉSEAU LOCAL
# =================================
networks:
  maintrix-local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16