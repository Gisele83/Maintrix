# 🐳 Docker Compose Simplifié - Maintrix
# Configuration minimale pour déploiement local rapide
# Services essentiels uniquement : Application + PostgreSQL

version: '3.8'

services:
  # =================================
  # APPLICATION MAINTRIX
  # =================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: maintrix-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://maintrix_user:maintrix_secure_password@db:5432/maintrix_db
      - SESSION_SECRET=maintrix_session_secret_very_long_and_secure_for_production
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=http://localhost:5000,http://127.0.0.1:5000
      # Configuration Paiements (à remplir avec vos clés)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
    networks:
      - maintrix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  db:
    image: postgres:15-alpine
    container_name: maintrix-db
    environment:
      - POSTGRES_DB=maintrix_db
      - POSTGRES_USER=maintrix_user
      - POSTGRES_PASSWORD=maintrix_secure_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - maintrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintrix_user -d maintrix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB

# =================================
# RÉSEAU INTERNE
# =================================
networks:
  maintrix-network:
    driver: bridge

# =================================
# VOLUMES PERSISTANTS
# =================================
# Note: Les volumes utilisent des bind mounts vers ./data/
# Créer les répertoires avec: mkdir -p data/{postgres,uploads,logs,backups}
