# 🐳 Docker Compose Simplifié - Maintrix
# Configuration minimale pour déploiement local rapide
# Services essentiels uniquement : Application + PostgreSQL

version: '3.8'

services:
  # =================================
  # APPLICATION MAINTRIX
  # =================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: maintrix-app
    ports:
      # Boucle locale uniquement. APP_HOST_PORT permet de cohabiter avec un
      # autre service deja sur 5000.
      - "127.0.0.1:${APP_HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maintrix_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}@db:5432/${POSTGRES_DB:-maintrix_db}
      # Secrets critiques : server/index.ts refuse de demarrer en production s'ils manquent
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET requis - generer avec scripts/generate-docker-env.sh}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET requis - generer avec scripts/generate-docker-env.sh}
      - KMS_MASTER_KEY=${KMS_MASTER_KEY:?KMS_MASTER_KEY requis - generer avec scripts/generate-docker-env.sh}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY requis - generer avec scripts/generate-docker-env.sh}
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=http://localhost:5000,http://127.0.0.1:5000
      # IA Diagnostic (Claude Anthropic)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Email (SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # Paiements (Stripe + PayPal)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
    networks:
      - maintrix-network
    healthcheck:
      # --max-time borne curl sous le `timeout: 10s` : une sonde lente doit
      # échouer nettement, jamais faire expirer le healthcheck lui-meme.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  db:
    image: postgres:15-alpine
    container_name: maintrix-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-maintrix_db}
      - POSTGRES_USER=${POSTGRES_USER:-maintrix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Port NON publie : joignable uniquement depuis le reseau interne maintrix-network
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - maintrix-network
    healthcheck:
      # $ = $ litteral : resolu par le shell DU CONTENEUR, donc suit
      # POSTGRES_USER / POSTGRES_DB meme s'ils sont surcharges.
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB

# =================================
# RÉSEAU INTERNE
# =================================
networks:
  maintrix-network:
    driver: bridge

# =================================
# VOLUMES PERSISTANTS
# =================================
# Note: Les volumes utilisent des bind mounts vers ./data/
# Créer les répertoires avec: mkdir -p data/{postgres,uploads,logs,backups}
