# 🐳 Docker Compose - Maintrix
# Configuration complète pour déploiement local avec tous les services

version: '3.8'

services:
  # =================================
  # APPLICATION MAINTRIX
  # =================================
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: maintrix-app
    ports:
      # Boucle locale uniquement : l'acces externe passe par nginx (80/443).
      # APP_HOST_PORT permet de cohabiter avec un autre service sur 5000
      # (machine de dev, ou plusieurs environnements de test sur un meme hote).
      - "127.0.0.1:${APP_HOST_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Base de donnees : mot de passe unique partage avec le service `db` (aucune valeur en dur)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maintrix_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}@db:5432/${POSTGRES_DB:-maintrix_db}
      # Secrets critiques : server/index.ts refuse de demarrer en production s'ils manquent
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET requis - generer avec scripts/generate-docker-env.sh}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET requis - generer avec scripts/generate-docker-env.sh}
      - KMS_MASTER_KEY=${KMS_MASTER_KEY:?KMS_MASTER_KEY requis - generer avec scripts/generate-docker-env.sh}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY requis - generer avec scripts/generate-docker-env.sh}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requis - generer avec scripts/generate-docker-env.sh}@redis:6379
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=http://localhost:5000,http://127.0.0.1:5000
      # IA Diagnostic (Claude Anthropic)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Email (SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # Paiements (Stripe + PayPal)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - maintrix-network
    healthcheck:
      # --max-time borne curl sous le `timeout: 10s` : une sonde lente doit
      # échouer nettement, jamais faire expirer le healthcheck lui-meme.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  db:
    image: postgres:15-alpine
    container_name: maintrix-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-maintrix_db}
      - POSTGRES_USER=${POSTGRES_USER:-maintrix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NON publie : joignable uniquement depuis le reseau interne maintrix-network
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - maintrix-network
    healthcheck:
      # $ = $ litteral : resolu par le shell DU CONTENEUR, donc suit
      # POSTGRES_USER / POSTGRES_DB meme s'ils sont surcharges.
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB

  # =================================
  # REDIS CACHE ET SESSIONS
  # =================================
  redis:
    image: redis:7-alpine
    container_name: maintrix-redis
    # Port NON publie : joignable uniquement depuis le reseau interne maintrix-network
    expose:
      - "6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD requis - generer avec scripts/generate-docker-env.sh}
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - maintrix-network
    healthcheck:
      # $$ = $ littéral : la variable est résolue par le shell DU CONTENEUR,
      # elle n'apparaît donc pas dans la sortie de `docker compose config`.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    # requirepass passe au lancement : le secret ne figure jamais dans redis/redis.conf (versionne)
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]

  # =================================
  # NGINX REVERSE PROXY
  # =================================
  nginx:
    image: nginx:alpine
    container_name: maintrix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - maintrix-network
    healthcheck:
      # 127.0.0.1 et NON localhost : dans nginx:alpine, `localhost` résout en
      # ::1 alors que nginx n'écoute qu'en IPv4 — la sonde échouait toujours et
      # le conteneur restait unhealthy en permanence.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =================================
  # MONITORING AVEC PROMETHEUS
  # =================================
  prometheus:
    image: prom/prometheus:latest
    container_name: maintrix-prometheus
    # Port NON publie : consultable via tunnel SSH ou reverse-proxy authentifie
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - maintrix-network

  # =================================
  # DASHBOARDS GRAFANA
  # =================================
  grafana:
    image: grafana/grafana:latest
    container_name: maintrix-grafana
    ports:
      # Boucle locale uniquement : acces admin via tunnel SSH, jamais expose a Internet
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD requis - generer avec scripts/generate-docker-env.sh}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - maintrix-network

  # =================================
  # SAUVEGARDE AUTOMATIQUE
  # =================================
  backup:
    image: postgres:15-alpine
    container_name: maintrix-backup
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-maintrix_db}
      - POSTGRES_USER=${POSTGRES_USER:-maintrix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis - voir .env.docker.example}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      - db
    restart: "no"
    networks:
      - maintrix-network
    # Sauvegarde quotidienne à 2h du matin
    deploy:
      replicas: 0
    command: /bin/sh -c "echo '0 2 * * * /backup.sh' | crontab - && crond -f"

# =================================
# VOLUMES PERSISTANTS
# =================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads
  
  logs_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/logs
  
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/backups
  
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/grafana

# =================================
# RÉSEAU INTERNE
# =================================
networks:
  maintrix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16