# 🚀 MAINTRIX - Configuration Docker Compose pour Windows
# Installation locale optimisée pour environnement Windows avec WSL2

version: '3.8'

services:
  # =================================
  # BASE DE DONNÉES POSTGRESQL
  # =================================
  maintrix-db:
    image: postgres:15-alpine
    container_name: maintrix-database-windows
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintrix_local
      POSTGRES_USER: maintrix_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maintrix_secure_windows_2024}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Optimisations Windows/WSL2
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Montage optimisé pour Windows
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      # Configuration PostgreSQL optimisée Windows
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - maintrix-windows
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintrix_admin -d maintrix_local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres 
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    labels:
      - "maintrix.service=database"
      - "maintrix.platform=windows"

  # =================================
  # APPLICATION MAINTRIX
  # =================================
  maintrix-app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - BUILDPLATFORM=linux/amd64
        - TARGETPLATFORM=linux/amd64
    image: maintrix:windows-latest
    container_name: maintrix-application-windows
    restart: unless-stopped
    depends_on:
      maintrix-db:
        condition: service_healthy
    environment:
      # Configuration Base
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      
      # Base de données locale
      DATABASE_URL: postgresql://maintrix_admin:${DB_PASSWORD:-maintrix_secure_windows_2024}@maintrix-db:5432/maintrix_local
      PGHOST: maintrix-db
      PGPORT: 5432
      PGUSER: maintrix_admin
      PGPASSWORD: ${DB_PASSWORD:-maintrix_secure_windows_2024}
      PGDATABASE: maintrix_local
      
      # Sécurité
      SESSION_SECRET: ${SESSION_SECRET:-maintrix_session_key_windows_secure_2024}
      
      # Installation Windows
      WINDOWS_DEPLOYMENT: "true"
      LOCAL_DEPLOYMENT: "true"
      DISABLE_TELEMETRY: "true"
      DISABLE_ANALYTICS: "true"
      PLATFORM: "windows"
      
      # APIs optionnelles (configurer selon besoins)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      
      # Optimisations Windows
      UV_THREADPOOL_SIZE: 8
      NODE_OPTIONS: "--max-old-space-size=2048"
      
      # Domaines autorisés (Windows/localhost)
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://0.0.0.0:${WEB_PORT:-8080},http://host.docker.internal:${WEB_PORT:-8080}
      
      # Chemins Windows-friendly
      UPLOAD_PATH: /app/uploads
      LOGS_PATH: /app/logs
      BACKUP_PATH: /app/backups
      
    ports:
      - "${WEB_PORT:-8080}:5000"
    volumes:
      # Volumes optimisés pour Windows/WSL2
      - app_uploads:/app/uploads
      - app_logs:/app/logs
      - app_backups:/app/backups
      - app_config:/app/config
      # Montage lecture seule pour config
      - ./config:/app/config:ro
    networks:
      - maintrix-windows
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    labels:
      - "maintrix.service=application"
      - "maintrix.platform=windows"
      - "maintrix.version=${MAINTRIX_VERSION:-2.0.0}"
    # Limites de ressources appropriées pour Windows
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # =================================
  # NGINX REVERSE PROXY (Windows Optimisé)
  # =================================
  maintrix-proxy:
    image: nginx:alpine
    container_name: maintrix-nginx-windows
    restart: unless-stopped
    depends_on:
      - maintrix-app
    environment:
      - UPSTREAM_HOST=maintrix-app
      - UPSTREAM_PORT=5000
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      # Configuration Nginx pour Windows
      - ./config/nginx/windows.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Volumes pour uploads et logs
      - app_uploads:/var/www/uploads:ro
      - nginx_logs:/var/log/nginx
      # SSL certificates (si configuré)
      - ./ssl:/etc/ssl/certs:ro
    networks:
      - maintrix-windows
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "maintrix.service=proxy"
      - "maintrix.platform=windows"
    profiles:
      - proxy  # Activer avec: docker-compose --profile proxy up

  # =================================
  # REDIS CACHE (Optionnel pour Windows)
  # =================================
  maintrix-redis:
    image: redis:7-alpine
    container_name: maintrix-redis-windows
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - maintrix-windows
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "maintrix.service=cache"
      - "maintrix.platform=windows"
    profiles:
      - cache  # Activer avec: docker-compose --profile cache up

  # =================================
  # SAUVEGARDE AUTOMATIQUE WINDOWS
  # =================================
  maintrix-backup:
    image: postgres:15-alpine
    container_name: maintrix-backup-service-windows
    restart: "no"
    depends_on:
      - maintrix-db
    environment:
      PGHOST: maintrix-db
      PGDATABASE: maintrix_local
      PGUSER: maintrix_admin
      PGPASSWORD: ${DB_PASSWORD:-maintrix_secure_windows_2024}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}  # 2h du matin par défaut
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      PLATFORM: windows
    volumes:
      - app_backups:/backups
      - ./scripts/windows/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
    networks:
      - maintrix-windows
    command: >
      /bin/sh -c "
      echo '${BACKUP_SCHEDULE:-0 2 * * *} /usr/local/bin/backup-entrypoint.sh' | crontab - && 
      crond -f -l 2"
    labels:
      - "maintrix.service=backup"
      - "maintrix.platform=windows"
    profiles:
      - backup  # Activer avec: docker-compose --profile backup up

  # =================================
  # MONITORING WINDOWS (Optionnel)
  # =================================
  maintrix-monitor:
    image: prom/node-exporter:latest
    container_name: maintrix-monitor-windows
    restart: unless-stopped
    ports:
      - "${MONITOR_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - maintrix-windows
    labels:
      - "maintrix.service=monitoring"
      - "maintrix.platform=windows"
    profiles:
      - monitoring  # Activer avec: docker-compose --profile monitoring up

# =================================
# VOLUMES PERSISTANTS WINDOWS
# =================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/data/postgres
  app_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/data/uploads
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/data/logs
  app_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/backups
  app_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/config
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/data/redis
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INSTALL_DIR:-C:/Maintrix}/data/nginx-logs

# =================================
# RÉSEAU WINDOWS OPTIMISÉ
# =================================
networks:
  maintrix-windows:
    driver: bridge
    name: maintrix-network-windows
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    labels:
      - "maintrix.network=main"
      - "maintrix.platform=windows"